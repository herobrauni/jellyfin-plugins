---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build WatchSync

on:
  push:
    tags:
      - "watchsync-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and release plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        working-directory: WatchSync/Jellyfin.Plugin.WatchSync
        run: dotnet publish -c Release -o out

      - name: Package
        run: |
          python3 tools/make-meta.py WatchSync/Jellyfin.Plugin.WatchSync/build.yaml /tmp/watchsync-meta.json
          VERSION=$(python3 -c "import json;print(json.load(open('/tmp/watchsync-meta.json'))['version'])")
          python3 tools/make-package.py /tmp/watchsync-meta.json "watchsync-${VERSION}.zip"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "watchsync-${VERSION}.zip" \
            --title "WatchSync ${VERSION} (Jellyfin 12.1)" \
            --notes "Rebuilt for Jellyfin 12.1 (net10.0). Fixes the scheduled full sync throwing MissingMethodException: IUserManager.get_Users()."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchsync-${{ env.VERSION }}
          path: watchsync-*.zip
