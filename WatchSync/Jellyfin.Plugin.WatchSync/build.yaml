changelog: |
  ## v1.1.0.0
  - Rebuilt for Jellyfin 12.1 (net10.0, Jellyfin.Controller 12.1.0)
  - IUserManager.Users was removed in 12.x; use GetUsers() instead
    (the scheduled full sync threw MissingMethodException on 12.x)
